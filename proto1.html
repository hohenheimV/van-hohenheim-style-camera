<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VHS Cam Prototype</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/vcr-osd-mono');

    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'VCR OSD Mono', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .viewport-container {
      flex: 1;
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .controls {
      width: 100%;
      background: #121212;
      padding: 8px 12px;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      max-height: 45vh;
      overflow-y: auto;
    }

    .control-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button, select, input[type="date"], input[type="time"], input[type="text"] {
      padding: 5px 8px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 3px;
      font-family: 'VCR OSD Mono', monospace;
      font-size: 11px;
    }

    button {
      cursor: pointer;
    }

    button:active {
      background: #444;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #rotateBtn {
      background: #0288d1;
      color: #fff;
      border-color: #03a9f4;
    }

    #snapBtn {
      background: #2e7d32;
      color: #fff;
      border-color: #4caf50;
    }

    #stopCamBtn {
      background: #444;
    }

    #recBtn.recording {
      background: #d32f2f;
      color: white;
      border-color: #f44336;
      animation: pulse 1.5s infinite;
    }

    #pauseBtn.paused {
      background: #f57c00;
      border-color: #ff9800;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    label {
      font-size: 11px;
      color: #aaa;
    }

    .zoom-display {
      font-size: 11px;
      min-width: 32px;
      text-align: center;
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <!-- Viewport -->
  <div class="viewport-container">
    <canvas id="vhsCanvas"></canvas>
  </div>

  <!-- Control Panel -->
  <div class="controls">
    <!-- Row 1: Hardware & Recording Controls -->
    <div class="control-row">
      <div class="control-group">
        <button id="startBtn">Start Cam</button>
        <button id="stopCamBtn" disabled>Stop Cam</button>
        <button id="recBtn" disabled>Start Rec</button>
        <button id="pauseBtn" disabled>Pause Rec</button>
        <button id="snapBtn" disabled>Snap 📸</button>
        <button id="rotateBtn">Rotate Overlay ↻</button>
      </div>

      <div class="control-group">
        <label for="resSelect">Res:</label>
        <select id="resSelect">
          <option value="720p">720p (HD Crisp)</option>
          <option value="480p" selected>480p (Retro VHS)</option>
          <option value="320p">320p (Low Quality)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="aspectSelect">Ratio:</label>
        <select id="aspectSelect">
          <option value="4:3">4:3 Retro</option>
          <option value="16:9">16:9 Wide</option>
        </select>
      </div>

      <div class="control-group">
        <label>Zoom:</label>
        <button id="zoomOutBtn" disabled>-</button>
        <span id="zoomVal" class="zoom-display">1.0x</span>
        <button id="zoomInBtn" disabled>+</button>
        <button id="zoomResetBtn" disabled>Reset</button>
      </div>
    </div>

    <!-- Row 2: Date/Time & On-Screen Display Toggles -->
    <div class="control-row">
      <div class="control-group">
        <label><input type="checkbox" id="recToggle" checked> REC Label</label>
        <label><input type="checkbox" id="dateToggle" checked> Timestamp</label>
        <label><input type="checkbox" id="timerToggle" checked> Rec Timer</label>
      </div>
      <div class="control-group">
        <label for="formatSelect">Format:</label>
        <select id="formatSelect">
          <option value="vhs_classic">03.oct.11 / 09:22 PM</option>
          <option value="ntsc">09:22:05 PM / OCT 03 2011</option>
          <option value="pal">21:22:05 / 03/10/2011</option>
        </select>
      </div>
      <div class="control-group">
        <label for="customDate">Date:</label>
        <input type="date" id="customDate">
      </div>
      <div class="control-group">
        <label for="customTime">Time:</label>
        <input type="time" id="customTime" step="1">
      </div>
      <div class="control-group">
        <button id="resetDateTimeBtn">Reset Time</button>
      </div>
    </div>

    <!-- Row 3: Retro Effects, Color Styles & Audio Options -->
    <div class="control-row">
      <div class="control-group">
        <label for="labelInput">Label:</label>
        <input type="text" id="labelInput" value="PLAY" maxlength="12" style="width:70px;">
      </div>
      <div class="control-group">
        <label for="styleFilterSelect">Filter Style:</label>
        <select id="styleFilterSelect">
          <option value="vhs" selected>Retro VHS Color</option>
          <option value="crossprocess">Cross Processed</option>
          <option value="technicolor">Technicolor 3-Strip</option>
        </select>
      </div>
      <div class="control-group">
        <label><input type="checkbox" id="glitchToggle" checked> Color Shift</label>
      </div>
      <div class="control-group">
        <label><input type="checkbox" id="grainToggle" checked> Tape Grain</label>
      </div>
      <div class="control-group">
        <label><input type="checkbox" id="trackingToggle" checked> VCR Tracking</label>
      </div>
      <div class="control-group">
        <label><input type="checkbox" id="micToggle"> Mic</label>
      </div>
    </div>
  </div>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('vhsCanvas');
    const ctx = canvas.getContext('2d');

    // Hardware Controls
    const startBtn = document.getElementById('startBtn');
    const stopCamBtn = document.getElementById('stopCamBtn');
    const recBtn = document.getElementById('recBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const snapBtn = document.getElementById('snapBtn');
    const rotateBtn = document.getElementById('rotateBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomVal = document.getElementById('zoomVal');

    // On-Screen Display Toggles
    const recToggle = document.getElementById('recToggle');
    const dateToggle = document.getElementById('dateToggle');
    const timerToggle = document.getElementById('timerToggle');

    // Toggles & Filters
    const resSelect = document.getElementById('resSelect');
    const aspectSelect = document.getElementById('aspectSelect');
    const labelInput = document.getElementById('labelInput');
    const styleFilterSelect = document.getElementById('styleFilterSelect');
    const glitchToggle = document.getElementById('glitchToggle');
    const grainToggle = document.getElementById('grainToggle');
    const trackingToggle = document.getElementById('trackingToggle');
    const formatSelect = document.getElementById('formatSelect');
    const customDate = document.getElementById('customDate');
    const customTime = document.getElementById('customTime');
    const resetDateTimeBtn = document.getElementById('resetDateTimeBtn');
    const micToggle = document.getElementById('micToggle');

    let zoomLevel = 1.0;
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let isPaused = false;
    let recStartTime = 0;
    let pausedTimeAccumulated = 0;
    let pauseStartTimestamp = 0;
    let animFrameId = null;

    // Overlay Rotation Angle (0, 90, 180, 270)
    let overlayRotationAngle = 0;

    // Canvas Native Resolution State
    let canvasWidth = 640;
    let canvasHeight = 480;

    // Dynamic Time Base Offset
    let baseTimeOffset = 0;

    // Media & Audio Context
    let mediaStream = null;
    let audioCtx = null;
    let micStreamSource = null;
    let processedAudioDestination = null;

    // Rotate Overlay (Labels + Effects) Handler
    rotateBtn.addEventListener('click', () => {
      overlayRotationAngle = (overlayRotationAngle + 90) % 360;
    });

    function updateCanvasDimensions() {
      const resVal = resSelect.value;
      const is16by9 = aspectSelect.value === '16:9';

      if (resVal === '720p') {
        canvasHeight = 720;
        canvasWidth = is16by9 ? 1280 : 960;
      } else if (resVal === '320p') {
        canvasHeight = 320;
        canvasWidth = is16by9 ? 568 : 426;
      } else { // 480p default
        canvasHeight = 480;
        canvasWidth = is16by9 ? 854 : 640;
      }

      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
    }

    resSelect.addEventListener('change', updateCanvasDimensions);
    aspectSelect.addEventListener('change', updateCanvasDimensions);
    updateCanvasDimensions();

    function setDefaultDate2011() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      customDate.value = `2011-${month}-${day}`;
      
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      customTime.value = `${hours}:${mins}:${secs}`;

      updateBaseTimeOffset();
    }

    function updateBaseTimeOffset() {
      if (!customDate.value || !customTime.value) return;
      const [y, m, d] = customDate.value.split('-');
      const [h, min, s] = customTime.value.split(':');
      const selectedDate = new Date(parseInt(y), parseInt(m) - 1, parseInt(d), parseInt(h), parseInt(min), parseInt(s || 0));
      baseTimeOffset = selectedDate.getTime() - Date.now();
    }

    customDate.addEventListener('change', updateBaseTimeOffset);
    customTime.addEventListener('change', updateBaseTimeOffset);
    resetDateTimeBtn.addEventListener('click', setDefaultDate2011);
    setDefaultDate2011();

    // Zoom Handlers
    function updateZoom(newZoom) {
      zoomLevel = Math.min(Math.max(newZoom, 1.0), 3.0);
      zoomVal.textContent = zoomLevel.toFixed(1) + 'x';
    }

    let zoomTimer = null;

    function startContinuousZoom(direction) {
      // Do one step immediately
      updateZoom(zoomLevel + direction);

      // Then continue while held
      if (zoomTimer) clearInterval(zoomTimer);

      zoomTimer = setInterval(() => {
        updateZoom(zoomLevel + direction);

        // Stop automatically at the limits
        if (zoomLevel >= 3.0 || zoomLevel <= 1.0) {
          stopContinuousZoom();
        }
      }, 100); // zoom every 100ms
    }

    function stopContinuousZoom() {
      if (zoomTimer) {
        clearInterval(zoomTimer);
        zoomTimer = null;
      }
    }

    zoomInBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      startContinuousZoom(0.2);
    });

    zoomOutBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      startContinuousZoom(-0.2);
    });

    zoomInBtn.addEventListener('pointerup', stopContinuousZoom);
    zoomInBtn.addEventListener('pointerleave', stopContinuousZoom);
    zoomInBtn.addEventListener('pointercancel', stopContinuousZoom);

    zoomOutBtn.addEventListener('pointerup', stopContinuousZoom);
    zoomOutBtn.addEventListener('pointerleave', stopContinuousZoom);
    zoomOutBtn.addEventListener('pointercancel', stopContinuousZoom);

    zoomResetBtn.addEventListener('click', () => {
      stopContinuousZoom();
      updateZoom(1.0);
    });

    // Hardware Control
    startBtn.addEventListener('click', async () => {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 3840 }, height: { ideal: 2160 } },
          audio: true
        });

        setupAudioPipeline(mediaStream);
        updateMicState();

        video.srcObject = mediaStream;
        video.play();

        startBtn.disabled = true;
        stopCamBtn.disabled = false;
        recBtn.disabled = false;
        snapBtn.disabled = false;
        zoomInBtn.disabled = false;
        zoomOutBtn.disabled = false;
        zoomResetBtn.disabled = false;

        processFrame();
      } catch (err) {
        alert("Camera/Mic access failed: " + err.message);
      }
    });

    stopCamBtn.addEventListener('click', stopCameraHardware);

    function stopCameraHardware() {
      if (animFrameId) cancelAnimationFrame(animFrameId);

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }

      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      startBtn.disabled = false;
      stopCamBtn.disabled = true;
      recBtn.disabled = true;
      pauseBtn.disabled = true;
      snapBtn.disabled = true;
      zoomInBtn.disabled = true;
      zoomOutBtn.disabled = true;
      zoomResetBtn.disabled = true;
    }

    // Audio Pipeline Set Up
    function setupAudioPipeline(stream) {
      if (audioCtx) audioCtx.close();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      processedAudioDestination = audioCtx.createMediaStreamDestination();

      const lowPassFilter = audioCtx.createBiquadFilter();
      lowPassFilter.type = 'lowpass';
      lowPassFilter.frequency.setValueAtTime(2500, audioCtx.currentTime);

      const gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(1.5, audioCtx.currentTime);

      lowPassFilter.connect(gainNode);
      gainNode.connect(processedAudioDestination);

      if (stream.getAudioTracks().length > 0) {
        micStreamSource = audioCtx.createMediaStreamSource(stream);
        micStreamSource.connect(lowPassFilter);
      }
    }

    function updateMicState() {
      if (mediaStream && mediaStream.getAudioTracks().length > 0) {
        mediaStream.getAudioTracks().forEach(track => {
          track.enabled = micToggle.checked;
        });
      }
      if (audioCtx && audioCtx.state === 'suspended' && micToggle.checked) {
        audioCtx.resume();
      }
    }

    micToggle.addEventListener('change', updateMicState);

    // Main Canvas Render Loop
    function processFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // Step 1: Draw Video Frame Base
        renderVideoFrame(canvasWidth, canvasHeight);

        // Step 2: Apply Color Filter Preset
        applyStyleFilter(canvasWidth, canvasHeight);

        // Step 3: Draw Rotated VHS Effects & Text Overlays Together
        renderRotatedOverlayLayer(canvasWidth, canvasHeight);
      }
      animFrameId = requestAnimationFrame(processFrame);
    }

    function renderVideoFrame(w, h) {
      const sw = video.videoWidth / zoomLevel;
      const sh = video.videoHeight / zoomLevel;
      const sx = (video.videoWidth - sw) / 2;
      const sy = (video.videoHeight - sh) / 2;
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
    }

    function applyStyleFilter(w, h) {
      const filter = styleFilterSelect.value;
      if (filter === 'vhs') return; // Standard canvas output

      const frameData = ctx.getImageData(0, 0, w, h);
      const data = frameData.data;

      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i + 1], b = data[i + 2];

        if (filter === 'crossprocess') {
          // Cross Processed: Crushed blacks, high saturation teal/yellow curve
          data[i]     = Math.min(255, Math.pow(r / 255, 1.2) * 255 * 1.1);
          data[i + 1] = Math.min(255, Math.pow(g / 255, 0.9) * 255 * 1.15);
          data[i + 2] = Math.max(0, Math.pow(b / 255, 1.4) * 255 * 0.85);

        } else if (filter === 'technicolor') {
          // Technicolor 3-Strip: High color separation (deep red & vivid cyan/green)
          data[i]     = Math.min(255, r * 1.35);
          data[i + 1] = Math.min(255, g * 1.15);
          data[i + 2] = Math.min(255, b * 0.85);
        }
      }

      ctx.putImageData(frameData, 0, 0);
    }

    function renderRotatedOverlayLayer(w, h) {
      ctx.save();

      // Transform space for both effects and labels
      if (overlayRotationAngle === 90) {
        ctx.translate(w, 0);
        ctx.rotate(90 * Math.PI / 180);
        applyEffectsAndLabels(h, w);
      } else if (overlayRotationAngle === 180) {
        ctx.translate(w, h);
        ctx.rotate(180 * Math.PI / 180);
        applyEffectsAndLabels(w, h);
      } else if (overlayRotationAngle === 270) {
        ctx.translate(0, h);
        ctx.rotate(-90 * Math.PI / 180);
        applyEffectsAndLabels(h, w);
      } else {
        applyEffectsAndLabels(w, h);
      }

      ctx.restore();
    }

    function applyEffectsAndLabels(w, h) {
      if (glitchToggle.checked) applyGlitchEffect(w, h);
      if (grainToggle.checked) renderTapeGrain(w, h);
      if (trackingToggle.checked) renderTrackingDistortion(w, h);

      drawTextContent(w, h);
    }

    function applyGlitchEffect(w, h) {
      const frameData = ctx.getImageData(0, 0, w, h);
      const data = frameData.data;

      for (let i = 0; i < data.length; i += 4) {
        if (i + 12 < data.length) {
          data[i] = data[i + 12];
        }
        data[i + 1] = data[i + 1] * 0.88;
      }
      ctx.putImageData(frameData, 0, 0);
    }

    function renderTapeGrain(w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const amount = 18;

      for (let i = 0; i < data.length; i += 4) {
        if (Math.random() < 0.15) {
          const noise = (Math.random() - 0.5) * amount;
          data[i] = Math.min(255, Math.max(0, data[i] + noise));
          data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
          data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function renderTrackingDistortion(w, h) {
      if (Math.random() < 0.35) {
        const jitterY = h - Math.floor(Math.random() * (h * 0.08)) - Math.floor(h * 0.02);
        const jitterHeight = Math.floor(Math.random() * (h * 0.02)) + 2;
        const shiftX = (Math.random() - 0.5) * (w * 0.025);

        const sliceData = ctx.getImageData(0, jitterY, w, jitterHeight);
        ctx.putImageData(sliceData, shiftX, jitterY);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.fillRect(0, jitterY, w, 1);
      }
    }

    function drawTextContent(w, h) {
      const fontSize = Math.max(18, Math.floor(h * 0.045));
      const pad = Math.floor(h * 0.05);

      const customText = labelInput.value.trim().toUpperCase();
      
      // Top Left Custom Label
      if (recToggle.checked && customText) {
        ctx.font = `${fontSize}px "VCR OSD Mono", monospace`;
        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = Math.max(2, Math.floor(h * 0.008));
        
        let displayLabel = customText;
        if (isRecording) {
          displayLabel = isPaused ? `PAUSE ${customText}` : `REC ${customText}`;
        }
        ctx.fillText(displayLabel, pad, pad * 1.2);
      }

      // Bottom Left Dynamic Timestamp
      if (dateToggle.checked) {
        const currentDynamicTime = new Date(Date.now() + baseTimeOffset);
        const formatted = getFormattedDateTime(currentDynamicTime, formatSelect.value);

        ctx.font = `${Math.floor(fontSize * 0.9)}px "VCR OSD Mono", monospace`;
        ctx.fillStyle = '#e6c229';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = Math.max(2, Math.floor(h * 0.008));

        ctx.fillText(formatted.timeStr, pad, h - (pad * 1.1));
        ctx.fillText(formatted.dateStr, pad, h - (pad * 0.4));
      }

      // Bottom Right Duration Timer
      if (timerToggle.checked && isRecording) {
        let elapsedMs = 0;
        if (isPaused) {
          elapsedMs = pauseStartTimestamp - recStartTime - pausedTimeAccumulated;
        } else {
          elapsedMs = Date.now() - recStartTime - pausedTimeAccumulated;
        }

        const elapsedStr = formatRecordedDuration(elapsedMs);

        ctx.font = `${Math.floor(fontSize * 0.9)}px "VCR OSD Mono", monospace`;
        ctx.fillStyle = isPaused ? '#ffaa00' : '#ff3333';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = Math.max(2, Math.floor(h * 0.008));
        ctx.textAlign = 'right';

        ctx.fillText(elapsedStr, w - pad, h - (pad * 0.4));
        ctx.textAlign = 'left';
      }
    }

    function formatRecordedDuration(ms) {
      const totalSecs = Math.floor(Math.max(0, ms) / 1000);
      const hrs = String(Math.floor(totalSecs / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSecs % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSecs % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function getFormattedDateTime(d, style) {
      const monthsShort = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      const yrFull = d.getFullYear();
      const yr2Digit = String(yrFull).slice(-2);
      let moName = monthsShort[d.getMonth()];
      const dayPad = String(d.getDate()).padStart(2, '0');
      const dayNum = d.getDate();

      let hours = d.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      const hours12 = String(hours % 12 || 12).padStart(2, '0');
      const minsPad = String(d.getMinutes()).padStart(2, '0');
      const secsPad = String(d.getSeconds()).padStart(2, '0');

      if (style === 'ntsc') {
        return {
          timeStr: `${hours12}:${minsPad}:${secsPad} ${ampm}`,
          dateStr: `${moName} ${dayPad} ${yrFull}`
        };
      } else if (style === 'pal') {
        return {
          timeStr: `${String(hours).padStart(2, '0')}:${minsPad}:${secsPad}`,
          dateStr: `${dayPad}/${String(d.getMonth() + 1).padStart(2, '0')}/${yrFull}`
        };
      } else {
        moName = moName.toLowerCase();
        return {
          // swap date top time bottom
          timeStr: `${dayNum}.${moName}.${yr2Digit}`,
          dateStr: `${hours12}:${minsPad} ${ampm}`
        };
      }
    }

    // Snap Picture Handler
    snapBtn.addEventListener('click', () => {
      const snapshotUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = snapshotUrl;
      a.download = `vhs_snap_${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // Recording Logic with Pause / Resume
    recBtn.addEventListener('click', () => {
      if (!isRecording) startRecording();
      else stopRecording();
    });

    pauseBtn.addEventListener('click', () => {
      if (!isRecording) return;

      if (!isPaused) {
        // Pause recording
        mediaRecorder.pause();
        isPaused = true;
        pauseStartTimestamp = Date.now();
        pauseBtn.textContent = 'Resume Rec';
        pauseBtn.classList.add('paused');
      } else {
        // Resume recording
        pausedTimeAccumulated += (Date.now() - pauseStartTimestamp);
        mediaRecorder.resume();
        isPaused = false;
        pauseBtn.textContent = 'Pause Rec';
        pauseBtn.classList.remove('paused');
      }
    });

    function startRecording() {
      recordedChunks = [];
      recStartTime = Date.now();
      pausedTimeAccumulated = 0;
      isPaused = false;

      const canvasStream = canvas.captureStream(30);
      
      const tracks = [...canvasStream.getVideoTracks()];
      if (processedAudioDestination && processedAudioDestination.stream.getAudioTracks().length > 0) {
        tracks.push(...processedAudioDestination.stream.getAudioTracks());
      }

      const combinedStream = new MediaStream(tracks);

      let options = { mimeType: 'video/webm;codecs=vp8,opus' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/mp4' };
      }

      try {
        mediaRecorder = new MediaRecorder(combinedStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(combinedStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = saveVideo;

      mediaRecorder.start();
      isRecording = true;
      recBtn.textContent = 'Stop & Save';
      recBtn.classList.add('recording');
      pauseBtn.disabled = false;
      pauseBtn.textContent = 'Pause Rec';
      pauseBtn.classList.remove('paused');
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      isPaused = false;
      recBtn.textContent = 'Start Rec';
      recBtn.classList.remove('recording');
      pauseBtn.disabled = true;
      pauseBtn.textContent = 'Pause Rec';
      pauseBtn.classList.remove('paused');
    }

    function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `vhs_${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        stopCameraHardware();
      }, 100);
    }
  </script>
</body>
</html>
