<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VHS Cam Prototype</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    .viewport-container {
      flex: 1;
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.3) 50%
      );
      background-size: 100% 4px;
    }
    .controls {
      width: 100%;
      background: #1a1a1a;
      padding: 10px;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      max-height: 40vh;
      overflow-y: auto;
    }
    .control-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button, select, input[type="date"], input[type="time"], input[type="text"] {
      padding: 6px 10px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
    button {
      cursor: pointer;
    }
    button:active {
      background: #444;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #stopCamBtn {
      background: #555;
    }
    #recBtn.recording {
      background: #d32f2f;
      color: white;
      border-color: #f44336;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    label {
      font-size: 12px;
      color: #aaa;
    }
    .zoom-display {
      font-size: 12px;
      min-width: 35px;
      text-align: center;
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <!-- Viewport -->
  <div class="viewport-container">
    <canvas id="vhsCanvas"></canvas>
  </div>

  <!-- Control Panel -->
  <div class="controls">
    <div class="control-row">
      <div class="control-group">
        <button id="startBtn">Start Cam</button>
        <button id="stopCamBtn" disabled>Stop Cam</button>
        <button id="recBtn" disabled>Start Rec</button>
      </div>
      <div class="control-group">
        <label>Zoom:</label>
        <button id="zoomOutBtn" disabled>-</button>
        <span id="zoomVal" class="zoom-display">1.0x</span>
        <button id="zoomInBtn" disabled>+</button>
        <button id="zoomResetBtn" disabled>Reset</button>
      </div>
    </div>

    <!-- Date/Time Settings -->
    <div class="control-row">
      <div class="control-group">
        <label><input type="checkbox" id="dateToggle" checked> Timestamp</label>
      </div>
      <div class="control-group">
        <label for="formatSelect">Format:</label>
        <select id="formatSelect">
          <option value="vhs_classic">PM 09 : 22 / 03 . OCT . 11</option>
          <option value="ntsc">OCT 03 2011 / 09:22 PM</option>
          <option value="pal">03/10/2011 / 21:22:00</option>
        </select>
      </div>
    </div>

    <div class="control-row">
      <div class="control-group">
        <label for="customDate">Date:</label>
        <input type="date" id="customDate">
      </div>
      <div class="control-group">
        <label for="customTime">Time:</label>
        <input type="time" id="customTime" step="1">
      </div>
      <div class="control-group">
        <button id="resetDateTimeBtn">Reset Time</button>
      </div>
    </div>

    <!-- Audio & Overlay Options -->
    <div class="control-row">
      <div class="control-group">
        <label for="labelInput">Label:</label>
        <input type="text" id="labelInput" value="PLAY" maxlength="12" style="width:70px;">
      </div>
      <div class="control-group">
        <label><input type="checkbox" id="glitchToggle" checked> Color Shift</label>
      </div>
      <div class="control-group">
        <label><input type="checkbox" id="micToggle" checked> Mic</label>
      </div>
      <div class="control-group">
        <button id="sysAudioBtn">Add System Audio</button>
      </div>
    </div>
  </div>

  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('vhsCanvas');
    const ctx = canvas.getContext('2d');

    // Control Elements
    const startBtn = document.getElementById('startBtn');
    const stopCamBtn = document.getElementById('stopCamBtn');
    const recBtn = document.getElementById('recBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomVal = document.getElementById('zoomVal');

    // Overlays & Inputs
    const labelInput = document.getElementById('labelInput');
    const dateToggle = document.getElementById('dateToggle');
    const glitchToggle = document.getElementById('glitchToggle');
    const formatSelect = document.getElementById('formatSelect');
    const customDate = document.getElementById('customDate');
    const customTime = document.getElementById('customTime');
    const resetDateTimeBtn = document.getElementById('resetDateTimeBtn');
    const micToggle = document.getElementById('micToggle');
    const sysAudioBtn = document.getElementById('sysAudioBtn');

    let zoomLevel = 1.0;
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let isLandscape = false;
    let animFrameId = null;

    // Streams & Audio Nodes
    let mediaStream = null;
    let audioCtx = null;
    let micStreamSource = null;
    let processedAudioDestination = null;
    let systemAudioStream = null;

    // Initialize Default Date to 2011 with today's month & day
    function setDefaultDate2011() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      customDate.value = `2011-${month}-${day}`;
      
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      customTime.value = `${hours}:${mins}:${secs}`;
    }
    setDefaultDate2011();

    resetDateTimeBtn.addEventListener('click', setDefaultDate2011);

    // Orientation Handling
    function checkOrientation() {
      isLandscape = window.innerWidth > window.innerHeight;
    }
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);
    checkOrientation();

    // Zoom Handling
    function updateZoom(newZoom) {
      zoomLevel = Math.min(Math.max(newZoom, 1.0), 3.0);
      zoomVal.textContent = zoomLevel.toFixed(1) + 'x';
    }
    zoomInBtn.addEventListener('click', () => updateZoom(zoomLevel + 0.2));
    zoomOutBtn.addEventListener('click', () => updateZoom(zoomLevel - 0.2));
    zoomResetBtn.addEventListener('click', () => updateZoom(1.0));

    // Start Camera Hardware
    startBtn.addEventListener('click', async () => {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: 1280, height: 720 },
          audio: true
        });
        
        video.srcObject = mediaStream;
        video.play();

        setupAudioPipeline(mediaStream);

        startBtn.disabled = true;
        stopCamBtn.disabled = false;
        recBtn.disabled = false;
        zoomInBtn.disabled = false;
        zoomOutBtn.disabled = false;
        zoomResetBtn.disabled = false;

        processFrame();
      } catch (err) {
        alert("Camera or Mic access failed: " + err.message);
      }
    });

    // Stop Camera Hardware completely
    stopCamBtn.addEventListener('click', stopCameraHardware);

    function stopCameraHardware() {
      if (isRecording) stopRecording();

      if (animFrameId) cancelAnimationFrame(animFrameId);

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (systemAudioStream) {
        systemAudioStream.getTracks().forEach(track => track.stop());
        systemAudioStream = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }

      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      startBtn.disabled = false;
      stopCamBtn.disabled = true;
      recBtn.disabled = true;
      zoomInBtn.disabled = true;
      zoomOutBtn.disabled = true;
      zoomResetBtn.disabled = true;
    }

    // Web Audio Low-Pass Filter Setup
    function setupAudioPipeline(micStream) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      processedAudioDestination = audioCtx.createMediaStreamDestination();

      const lowPassFilter = audioCtx.createBiquadFilter();
      lowPassFilter.type = 'lowpass';
      lowPassFilter.frequency.setValueAtTime(2500, audioCtx.currentTime);

      const gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(1.2, audioCtx.currentTime);

      lowPassFilter.connect(gainNode);
      gainNode.connect(processedAudioDestination);

      // Mic Input
      if (micStream.getAudioTracks().length > 0) {
        micStreamSource = audioCtx.createMediaStreamSource(micStream);
        micStreamSource.connect(lowPassFilter);
      }
    }

    // Toggle Mic Mute
    micToggle.addEventListener('change', (e) => {
      if (mediaStream && mediaStream.getAudioTracks().length > 0) {
        mediaStream.getAudioTracks()[0].enabled = e.target.checked;
      }
    });

    // Capture Background / System Audio
    sysAudioBtn.addEventListener('click', async () => {
      try {
        systemAudioStream = await navigator.mediaDevices.getDisplayMedia({
          video: false,
          audio: true
        });
        if (audioCtx && systemAudioStream.getAudioTracks().length > 0) {
          const sysSource = audioCtx.createMediaStreamSource(systemAudioStream);
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(3000, audioCtx.currentTime);
          sysSource.connect(filter);
          filter.connect(processedAudioDestination);
          sysAudioBtn.textContent = "Sys Audio Added";
          sysAudioBtn.disabled = true;
        }
      } catch (err) {
        console.log("System audio capture cancelled or not supported:", err);
      }
    });

    // Main Canvas Render Loop
    function processFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = 640;
        canvas.height = 480;

        const sw = 640 / zoomLevel;
        const sh = 480 / zoomLevel;
        const sx = (640 - sw) / 2;
        const sy = (480 - sh) / 2;

        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, 640, 480);

        if (glitchToggle.checked) {
          const frameData = ctx.getImageData(0, 0, 640, 480);
          const data = frameData.data;

          for (let i = 0; i < data.length; i += 4) {
            if (i + 12 < data.length) {
              data[i] = data[i + 12];
            }
            data[i + 1] = data[i + 1] * 0.88;
          }
          ctx.putImageData(frameData, 0, 0);
        }

        ctx.save();
        if (isLandscape) {
          ctx.translate(640, 0);
          ctx.rotate(90 * Math.PI / 180);
          renderOverlays(480, 640);
        } else {
          renderOverlays(640, 480);
        }
        ctx.restore();
      }
      animFrameId = requestAnimationFrame(processFrame);
    }

    function renderOverlays(w, h) {
      const customText = labelInput.value.trim().toUpperCase();
      
      // Top Left Label
      if (customText) {
        ctx.font = 'bold 22px monospace';
        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.fillText(isRecording ? `REC ${customText}` : customText, 25, 45);
      }

      // Bottom Left Multi-line Timestamp
      if (dateToggle.checked) {
        const dateTimeObj = parseSelectedDateTime();
        const formatted = getFormattedDateTime(dateTimeObj, formatSelect.value);

        ctx.font = '20px monospace';
        ctx.fillStyle = '#e6c229'; // VHS Yellow
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;

        // Line 1: Time (Top)
        ctx.fillText(formatted.timeStr, 25, h - 60);
        // Line 2: Date (Bottom)
        ctx.fillText(formatted.dateStr, 25, h - 32);
      }
    }

    function parseSelectedDateTime() {
      let d = new Date();
      if (customDate.value) {
        const [y, m, day] = customDate.value.split('-');
        d.setFullYear(parseInt(y), parseInt(m) - 1, parseInt(day));
      }
      if (customTime.value) {
        const [h, min, s] = customTime.value.split(':');
        d.setHours(parseInt(h), parseInt(min), parseInt(s || 0));
      }
      return d;
    }

    function getFormattedDateTime(d, style) {
      const monthsShort = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      const yrFull = d.getFullYear();
      const yr2Digit = String(yrFull).slice(-2);
      const moName = monthsShort[d.getMonth()];
      const dayPad = String(d.getDate()).padStart(2, '0');
      const dayNum = d.getDate();

      let hours = d.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      const hours12 = String(hours % 12 || 12).padStart(2, '0');
      const minsPad = String(d.getMinutes()).padStart(2, '0');
      const secsPad = String(d.getSeconds()).padStart(2, '0');

      if (style === 'ntsc') {
        return {
          timeStr: `${hours12}:${minsPad}:${secsPad} ${ampm}`,
          dateStr: `${moName} ${dayPad} ${yrFull}`
        };
      } else if (style === 'pal') {
        return {
          timeStr: `${String(hours).padStart(2, '0')}:${minsPad}:${secsPad}`,
          dateStr: `${dayPad}/${String(d.getMonth() + 1).padStart(2, '0')}/${yrFull}`
        };
      } else {
        // Default Classic VHS style: PM 9 : 22 / 3 . OCT . 11
        return {
          timeStr: `${ampm} ${hours12} : ${minsPad}`,
          dateStr: `${dayNum} . ${moName} . ${yr2Digit}`
        };
      }
    }

    // Recording Logic
    recBtn.addEventListener('click', () => {
      if (!isRecording) startRecording();
      else stopRecording();
    });

    function startRecording() {
      recordedChunks = [];
      const canvasStream = canvas.captureStream(30);
      
      const tracks = [...canvasStream.getVideoTracks()];
      if (processedAudioDestination && processedAudioDestination.stream.getAudioTracks().length > 0) {
        tracks.push(...processedAudioDestination.stream.getAudioTracks());
      }

      const combinedStream = new MediaStream(tracks);

      let options = { mimeType: 'video/webm;codecs=vp8,opus' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/mp4' };
      }

      try {
        mediaRecorder = new MediaRecorder(combinedStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(combinedStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = saveVideo;

      mediaRecorder.start();
      isRecording = true;
      recBtn.textContent = 'Stop & Save';
      recBtn.classList.add('recording');
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      recBtn.textContent = 'Start Rec';
      recBtn.classList.remove('recording');
    }

    function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `vhs_${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    }
  </script>
</body>
</html>
