<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>ArcGIS Map Test</title>

    <!-- ArcGIS CSS -->
    <link rel="stylesheet"
          href="https://js.arcgis.com/4.13/esri/css/main.css">

    <!-- ArcGIS JavaScript API -->
    <script src="https://js.arcgis.com/4.13/"></script>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #viewDiv {
            width: 100%;
            height: 500px;
        }
    </style>
</head>

<body>

    <h3>ArcGIS Map Test</h3>

    <div id="viewDiv"></div>


    <script>

        console.log("TEST 1 - JavaScript loaded");

        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/Graphic",
            "esri/layers/GraphicsLayer"
        ], function (
            Map,
            MapView,
            Graphic,
            GraphicsLayer
        ) {

            console.log("TEST 2 - ArcGIS modules loaded");


            // ==========================================
            // Graphics layer
            // ==========================================

            var graphicsLayer = new GraphicsLayer();


            // ==========================================
            // Create map
            // ==========================================

            var map = new Map({
                basemap: "satellite",
                layers: [
                    graphicsLayer
                ]
            });

            console.log("TEST 3 - Map created");


            // ==========================================
            // Create MapView
            // ==========================================

            var view = new MapView({
                container: "viewDiv",
                map: map,

                // Kuala Lumpur
                center: [
                    101.68833,
                    3.15475
                ],

                zoom: 10
            });

            console.log("TEST 4 - MapView created");


            // ==========================================
            // Wait until map is ready
            // ==========================================

            view.when(function () {

                console.log("TEST 5 - MAP SUCCESS");

                // Initial marker
                showMarker(
                    3.15475,
                    101.68833
                );

            }, function (error) {

                console.error(
                    "MAP FAILED:",
                    error
                );

            });


            // ==========================================
            // Function to display marker
            // ==========================================

            function showMarker(latitude, longitude) {

                var point = {
                    type: "point",
                    longitude: longitude,
                    latitude: latitude
                };


                var graphic = new Graphic({

                    geometry: point,

                    symbol: {
                        type: "simple-marker",

                        color: "red",

                        size: 10,

                        outline: {
                            color: "white",
                            width: 1
                        }
                    }

                });


                graphicsLayer.removeAll();

                graphicsLayer.add(graphic);


                console.log(
                    "Marker:",
                    latitude,
                    longitude
                );
            }


            // ==========================================
            // Click map
            // ==========================================

            view.on("click", function (event) {

                var point = view.toMap({
                    x: event.x,
                    y: event.y
                });


                console.log(
                    "CLICK:",
                    point.latitude,
                    point.longitude
                );


                showMarker(
                    point.latitude,
                    point.longitude
                );

            });

        });

    </script>

</body>
</html>
