<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VHS Cam Prototype</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      position: relative;
      width: 90vw;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      border: 2px solid #333;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      /* CSS Scanlines overlay effect */
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <canvas id="vhsCanvas"></canvas>
  </div>

  <div class="controls">
    <label for="zoomSlider">Zoom: </label>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
    <button id="startBtn">Start Camera</button>
  </div>

  <!-- Hidden Video Element to Capture Stream -->
  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('vhsCanvas');
    const ctx = canvas.getContext('2d');
    const zoomSlider = document.getElementById('zoomSlider');
    const startBtn = document.getElementById('startBtn');

    let zoomLevel = 1;

    zoomSlider.addEventListener('input', (e) => {
      zoomLevel = parseFloat(e.target.value);
    });

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: 640, height: 480 },
          audio: false
        });
        video.srcObject = stream;
        video.play();
        startBtn.style.display = 'none';
        requestAnimationFrame(processFrame);
      } catch (err) {
        alert("Camera access failed: " + err.message);
      }
    });

    function processFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = 640;
        canvas.height = 480;

        // Apply Zoom by adjusting source crop dimensions
        const sw = 640 / zoomLevel;
        const sh = 480 / zoomLevel;
        const sx = (640 - sw) / 2;
        const sy = (480 - sh) / 2;

        // Draw camera frame with zoom
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, 640, 480);

        // Simple VHS Color Degradation (RGB Color Shift)
        const frameData = ctx.getImageData(0, 0, 640, 480);
        const data = frameData.data;

        for (let i = 0; i < data.length; i += 4) {
          // Shift Red channel slightly ahead to mimic analog tape color bleed
          if (i + 12 < data.length) {
            data[i] = data[i + 12]; 
          }
          // Reduce overall green tone slightly for retro tinting
          data[i + 1] = data[i + 1] * 0.9; 
        }

        ctx.putImageData(frameData, 0, 0);
      }
      requestAnimationFrame(processFrame);
    }
  </script>
</body>
</html>
