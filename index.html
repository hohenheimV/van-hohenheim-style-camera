<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Utama</title>
</head>
<body>

  <!-- Menu / Tiles -->
  <div id="navigation">
    <button onclick="loadModule('penyata.html')">Modul A</button>
    <button onclick="loadModule('module-b.html')">Modul B</button>
  </div>

  <hr>

  <!-- Bekas tempat kandungan modul dimuatkan -->
  <div id="main-content">
    <h2>Selamat Datang ke Dashboard</h2>
    <p>Pilih modul di atas untuk bermula.</p>
  </div>

  <script>
    async function loadModule(file) {
      try {
        const response = await fetch(`modules/${file}`);
        if (!response.ok) throw new Error('Gagal memuatkan modul');
        
        const htmlContent = await response.text();
        
        // Tukar / ganti elemen kandungan
        document.getElementById('main-content').innerHTML = htmlContent;
        
      } catch (err) {
        document.getElementById('main-content').innerHTML = '<p>Ralat memuatkan fail.</p>';
      }
    }
  </script>
</body>
</html>
