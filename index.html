<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VHS Cam Prototype</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      position: relative;
      width: 90vw;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      border: 2px solid #333;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      /* CSS Scanlines overlay effect */
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 16px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      font-family: monospace;
    }
    button:disabled {
      opacity: 0.5;
    }
    #recBtn.recording {
      background: #d32f2f;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <canvas id="vhsCanvas"></canvas>
  </div>

  <div class="controls">
    <label for="zoomSlider">Zoom: </label>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
    <button id="startBtn">Start Camera</button>
    <button id="recBtn" disabled>Start Rec</button>
  </div>

  <!-- Hidden Video Element to Capture Stream -->
  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('vhsCanvas');
    const ctx = canvas.getContext('2d');
    const zoomSlider = document.getElementById('zoomSlider');
    const startBtn = document.getElementById('startBtn');
    const recBtn = document.getElementById('recBtn');

    let zoomLevel = 1;
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    zoomSlider.addEventListener('input', (e) => {
      zoomLevel = parseFloat(e.target.value);
    });

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: 640, height: 480 },
          audio: false
        });
        video.srcObject = stream;
        video.play();
        startBtn.style.display = 'none';
        recBtn.disabled = false;
        requestAnimationFrame(processFrame);
      } catch (err) {
        alert("Camera access failed: " + err.message);
      }
    });

    function processFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = 640;
        canvas.height = 480;

        // Apply Zoom by adjusting source crop dimensions
        const sw = 640 / zoomLevel;
        const sh = 480 / zoomLevel;
        const sx = (640 - sw) / 2;
        const sy = (480 - sh) / 2;

        // Draw camera frame with zoom
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, 640, 480);

        // Simple VHS Color Degradation (RGB Color Shift)
        const frameData = ctx.getImageData(0, 0, 640, 480);
        const data = frameData.data;

        for (let i = 0; i < data.length; i += 4) {
          if (i + 12 < data.length) {
            data[i] = data[i + 12]; 
          }
          data[i + 1] = data[i + 1] * 0.9; 
        }

        ctx.putImageData(frameData, 0, 0);
      }
      requestAnimationFrame(processFrame);
    }

    // Recording Logic
    recBtn.addEventListener('click', () => {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      recordedChunks = [];
      const canvasStream = canvas.captureStream(30); // 30 FPS
      
      let options = { mimeType: 'video/webm' };
      if (!MediaRecorder.isTypeSupported('video/webm')) {
        options = { mimeType: 'video/mp4' };
      }

      try {
        mediaRecorder = new MediaRecorder(canvasStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(canvasStream);
      }

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = saveVideo;

      mediaRecorder.start();
      isRecording = true;
      recBtn.textContent = 'Stop & Save';
      recBtn.classList.add('recording');
    }

    function stopRecording() {
      mediaRecorder.stop();
      isRecording = false;
      recBtn.textContent = 'Start Rec';
      recBtn.classList.remove('recording');
    }

    function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `vhs_clip_${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    }
  </script>
</body>
</html>
